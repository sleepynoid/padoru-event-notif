services:
  padoru-event-notif:
    image: sleepynoid/padoru-event-notif:latest
    container_name: padoru-event-notif
    restart: unless-stopped
    ports:
      - "3000:4321"

    # Security: Read-only filesystem
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001

    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GOOGLE_SHEET_URL=${GOOGLE_SHEET_URL}
      - SYNC_SECRET=${SYNC_SECRET}
      - SITE_URL=${SITE_URL}

    # Security: Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    # Health check
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "app=padoru-event-notif"
      - "environment=production"

  # Watchtower - Auto-update containers when new images are pushed
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - TZ=Asia/Jakarta
    command: --interval 3600

    # Security
    security_opt:
      - no-new-privileges:true

    labels:
      - "app=watchtower"
